{{! Details elements that share a name form an exclusive accordion, natively and without JavaScript. }}
<div class="acme-faq">
  {{#items}}
  <details class="acme-faq__item" name="{{group}}">
    <summary class="acme-faq__question">{{question}}</summary>
    <div class="acme-faq__answer">{{{answer}}}</div>
  </details>
  {{/items}}
</div>
