<div class="acme-feature acme-feature--{{layout}}">
  <svg class="acme-feature__icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {{#icon=check}}<path d="M5 12l5 5L20 7"/>{{/icon=check}}
    {{#icon=bolt}}<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>{{/icon=bolt}}
    {{#icon=shield}}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>{{/icon=shield}}
  </svg>
  <div>
    <h3 class="acme-feature__title">{{title}}</h3>
    <p class="acme-feature__text">{{text}}</p>
  </div>
</div>
