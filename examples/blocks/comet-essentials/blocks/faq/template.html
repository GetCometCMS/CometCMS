{{! Details elements that share a name form an exclusive accordion, natively and without JavaScript. }}
<div class="cometcms-faq">
  {{#items}}
  <details class="cometcms-faq__item" name="{{group}}">
    <summary class="cometcms-faq__question">{{question}}</summary>
    <div class="cometcms-faq__answer">{{{answer}}}</div>
  </details>
  {{/items}}
</div>
